<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Polígonos</title>
    <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <script>
        // Inicializa el mapa
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://demotiles.maplibre.org/style.json',
            center: [-90.5069, 14.6349], // Coordenadas iniciales
            zoom: 12,
        });

        // URL del archivo GeoJSON
        const geojsonUrl = "https://tuusuario.github.io/tu-repo/propiedades.geojson";

        // Agregar el archivo GeoJSON como una fuente de datos
        map.on('load', () => {
            fetch(geojsonUrl)
                .then(response => response.json())
                .then(data => {
                    map.addSource('polygons', {
                        type: 'geojson',
                        data: data,
                    });

                    // Agregar capa para los polígonos
                    map.addLayer({
                        id: 'polygon-layer',
                        type: 'fill',
                        source: 'polygons',
                        paint: {
                            'fill-color': '#888888',
                            'fill-opacity': 0.5,
                        },
                    });

                    // Agregar bordes a los polígonos
                    map.addLayer({
                        id: 'polygon-borders',
                        type: 'line',
                        source: 'polygons',
                        paint: {
                            'line-color': '#000000',
                            'line-width': 1,
                        },
                    });

                    // Mostrar información al hacer clic en un polígono
                    map.on('click', 'polygon-layer', e => {
                        const coordinates = e.lngLat;
                        const properties = e.features[0].properties;
                        const description = `
                            <strong>Información:</strong><br>
                            ${JSON.stringify(properties, null, 2)}
                        `;
                        new maplibregl.Popup()
                            .setLngLat(coordinates)
                            .setHTML(description)
                            .addTo(map);
                    });

                    // Cambiar cursor al pasar sobre un polígono
                    map.on('mouseenter', 'polygon-layer', () => {
                        map.getCanvas().style.cursor = 'pointer';
                    });

                    map.on('mouseleave', 'polygon-layer', () => {
                        map.getCanvas().style.cursor = '';
                    });
                })
                .catch(error => console.error('Error al cargar el GeoJSON:', error));
        });
    </script>
</body>
</html>
